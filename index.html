<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crasher Guid</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: transparent;
      margin: 0;
      padding: 0;
      color: #f8f8f8;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      height: 100vh;
      overflow: hidden;
    }

    .help-box {
      width: 260px;
      background: rgba(22, 22, 22, 0.9);
      border-radius: 14px;
      padding: 11px 16px;
      border: 1px solid rgba(192, 192, 192, 0.3);
      position: relative;
      margin-top: 10%;
      overflow: hidden;
    }

    .wave-effect {
      position: absolute;
      top: 0;
      left: -75%;
      width: 50%;
      height: 100%;
      background: linear-gradient(
        120deg,
        rgba(255, 255, 255, 0.0) 0%,
        rgba(255, 255, 255, 0.12) 40%,
        rgba(255, 255, 255, 0.2) 50%,
        rgba(255, 255, 255, 0.12) 60%,
        rgba(255, 255, 255, 0.0) 100%
      );
      transform: skewX(-25deg);
      animation: waveAnimation 2.5s infinite;
      pointer-events: none;
      z-index: 1;
      opacity: 0.6;
    }

    @keyframes waveAnimation {
      0% { left: -75%; }
      100% { left: 130%; }
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 11px;
      position: relative;
      z-index: 2;
    }

    .title {
      color: #d1d5db;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
      text-shadow: 0 0 4px rgba(192, 192, 192, 0.3);
    }

    .logo-wrapper {
      position: relative;
      width: 42px;
      height: 42px;
      border-radius: 8px;
      border: 2px solid #c0c0c0;
      box-shadow: 0 0 20px rgba(192, 192, 192, 0.9);
      animation: glowPulse 2s infinite ease-in-out;
      z-index: 2;
      overflow: hidden;
    }

    @keyframes glowPulse {
      0% { box-shadow: 0 0 12px rgba(192, 192, 192, 0.6); }
      50% { box-shadow: 0 0 24px rgba(192, 192, 192, 1); }
      100% { box-shadow: 0 0 12px rgba(192, 192, 192, 0.6); }
    }

    .logo {
      width: 100%;
      height: auto;
      border-radius: 6px;
    }

    .control {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      margin-bottom: 7px;
      font-size: 13.5px;
      color: #e2e8f0;
      font-weight: 400;
      line-height: 1.2;
      position: relative;
      z-index: 2;
    }

    .control span:first-child {
      text-align: left;
      padding-left: 1px;
    }

    .key {
      background: #c0c0c0;
      color: #1e293b;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 11px;
      text-align: center;
      letter-spacing: 0.01em;
      white-space: nowrap;
      justify-self: end;
      min-width: 60px;
      box-shadow: 0 0 6px 0 rgba(192, 192, 192, 0.4);
    }

    .glow-line {
      height: 1px;
      background: linear-gradient(90deg, 
        rgba(192, 192, 192, 0) 0%, 
        rgba(192, 192, 192, 0.3) 40%, 
        rgba(255, 255, 255, 0.7) 50%, 
        rgba(192, 192, 192, 0.3) 60%, 
        rgba(192, 192, 192, 0) 100%);
      box-shadow: 0 0 10px 1px rgba(192, 192, 192, 0.4);
      margin: 4px 0;
      position: relative;
      z-index: 2;
    }

    .footer {
      text-align: center;
      color: #94a3b8;
      font-size: 10px;
      margin-top: 8px;
      opacity: 0.85;
      font-weight: 400;
      letter-spacing: 0.05em;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  <div class="help-box">
    <div class="wave-effect"></div>
    <div class="header">
      <div class="title">Crasher Guid</div>
      <div class="logo-wrapper">
        <img src="https://h.top4top.io/p_3574p8zp01.png" alt="YAZAN Logo" class="logo">
      </div>
    </div>
    <div class="glow-line"></div>

    <div class="control"><span>Select</span><span class="key">Alt</span></div>
    <div class="control"><span>Unselect</span><span class="key">Q</span></div>
    <div class="control"><span>Execute</span><span class="key">E</span></div>

    <div class="glow-line"></div>
    <div class="footer">F6 to toggle</div>
  </div>
</body>
</html>
